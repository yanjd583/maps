
<!DOCTYPE html>
<html lang="ja">
<head>
<!-- wexal_pst_init.js does not exist -->
<meta charset="utf-8">
<title>Leaflet GeoJSON Filter GUI デモ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="style.css">
<style>
    html, body, #map { margin:0; padding:0; width:100%; height:100vh; }
    .controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(255,255,255,0.9);
      padding: 0.5rem;
      border-radius: 4px;
      font-size: 0.9rem;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
    }
    .controls label { display: block; margin-bottom: 0.5rem; }
    .controls input[type="range"] { width: 150px; }
  </style>
</head>
<body>
<div id="map"></div>
<div class="controls">
<label>表示年: <span id="threshold-label">1950</span></label>
<input type="range" id="threshold" min="1860" max="2100" value="1950">
<label><input type="checkbox" id="filter-toggle" checked>時系列有効</label>
<br>
<label><input type="radio" id="N05_001" checked name="layer" value="1">種別</label>
<div id="aaa" style="display:name;">あああ</div>
<label><input type="radio" id="gauge" name="layer" value="2">軌間</label>
<div id="iii" style="display:name;">いいい</div>
<label><input type="radio" id="Electrific" name="layer" value="3">電化</label>
<div id="uuu" style="display:name;">ううう</div>

<iframe src="hanrei.html" width="150px" height="310px"></iframe>

</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="01_Hokkaido.js"></script>

<script>
  const map = L.map('map', { zoomControl: false })
      .setView([43.0619, 141.3544], 10);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);


let sta01original, rail01original;
let sta01layer, rail01layer;
const thresholdInput = document.getElementById('threshold');
const thresholdLabel = document.getElementById('threshold-label');
const filterToggle = document.getElementById('filter-toggle');
const owner = document.getElementById('N05_001');
const gauge_size = document.getElementById('gauge');
const elect = document.getElementById('Electrific');
//var customIcon = L.icon({
//  iconUrl: 'https://cdn-icons-png.flaticon.com/512/684/684908.png',
//  iconSize: [24, 24],
//  iconAnchor: [12, 24],
//  popupAnchor: [0, -24]
//});
var customIcon = L.divIcon({
    className: 'circle',
    iconSize: [7, 7],
});
// GeoJSONを読み込んで初期化

fetch('01_Rail_hokkaido.geojson')
  .then(res => res.json())
  .then(data => {
    rail01original = data;
    updateLayer();
  })
  .catch(err => console.error('GeoJSON 読み込みエラー:', err));

    
fetch('01_Sta_hokkaido.geojson')
  .then(res => res.json())
  .then(data => {
    sta01original = data;
    updateLayer();
  })
  .catch(erro => console.error('GeoJSON 読み込みエラー:', err));

// レイヤ更新関数
function updateLayer() {
  const thresh = +thresholdInput.value;
  thresholdLabel.textContent = thresh;
  if (rail01layer) {
    map.removeLayer(rail01layer);
  }
  if (sta01layer) {
    map.removeLayer(sta01layer);
  }
  rail01layer = L.geoJSON(rail01original, {
    filter: features => {
      if (!filterToggle.checked) return true;
      return features.properties.start_y <= thresh && features.properties.end_y >= thresh;
    },
    //pointToLayer: function(features, latlng) {
    //  return L.marker(latlng, {icon: customIcon});
    //},

    style: (features) => {
      const styleOptions = {
        weight: features.properties.line * 2.5
      };

      if (owner.checked) {
        styleOptions.color = features.properties.N05_001 === '1' ? '#ff0000' ://赤
                             features.properties.N05_001 === '2' ? '#000000' ://黒
                             features.properties.N05_001 === '3' ? '#0000aa' ://紺
                             features.properties.N05_001 === '4' ? '#008800' ://緑
                             features.properties.N05_001 === '5' ? '#0088ff' ://青
                             features.properties.N05_001 === '6' ? '#880088' ://紫
                             features.properties.N05_001 === '7' ? '#773300' ://茶
                             '#777777';//灰
      } else if (gauge_size.checked) {
        styleOptions.color = features.properties.gauge === 762 ? '#773300' ://茶
                             features.properties.gauge === 1050 ? '#008800' ://緑
                             features.properties.gauge === 1067 ? '#0088ff' ://青
                             features.properties.gauge === 1372 ? '#880088' ://紫
                             features.properties.gauge === 1435 ? '#ff0000' ://赤
                             '#000000';//黒
      } else if (elect.checked) {
        styleOptions.color = features.properties.Electrific === 'AC 25000V' ? '#ff0000' ://赤
                             features.properties.Electrific === 'AC 20000V' ? '#ff55cc' ://桃
                             features.properties.Electrific === 'DC 1500V' ? '#0000aa' ://紺
                             features.properties.Electrific === 'DC 750V' ? '#0088ff' ://青
                             features.properties.Electrific === 'DC 600V' ? '#008800' ://緑
                             '#000000';//黒
      } else {
        styleOptions.color = 'red';
      }

      return styleOptions;
    },
    
    onEachFeature: (features, layer) => {
      layer.bindPopup(`会社: ${features.properties.N05_003}<br>
      路線: ${features.properties.N05_002}<br>
      軌間: ${features.properties.gauge}<br>
      電化: ${features.properties.Electrific}<br>
      開: ${features.properties.start_org}<br>
      自: ${features.properties.start}<br>
      至: ${features.properties.end}`);
    }
    
  }).addTo(map);

  sta01layer = L.geoJSON(sta01original, {
    filter: features => {
      if (!filterToggle.checked) return true;
      return features.properties.start_y <= thresh && features.properties.end_y >= thresh;
    },
    pointToLayer: function(features, latlng) {
      return L.marker(latlng, {icon: customIcon});
    },
    
    onEachFeature: (features, layer) => {
      layer.bindPopup(`駅名: ${features.properties.N05_011}<br>
      会社: ${features.properties.N05_003}<br>
      路線: ${features.properties.N05_002}<br>
      開: ${features.properties.start_org}<br>
      自: ${features.properties.start}<br>
      至: ${features.properties.end}`);
    }
    
  }).addTo(map);

}

function init(){
    var overlay = {
        "rail": rail01layer,
        "station": sta01layer
    }
    L.control.layers(null, overlay).addTo(map);
}
    

  // GUIイベント
  thresholdInput.addEventListener('input', updateLayer);
  filterToggle.addEventListener('change', updateLayer);

</script>
    
</body>
</html>
