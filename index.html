<!DOCTYPE html>
<html lang="ja">
<head>
<!-- wexal_pst_init.js does not exist -->
<meta charset="utf-8">
<title>日本鉄道変遷地図</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="style.css">
<style>
    html, body, #map { margin:0; padding:0; width:100%; height:100vh; }
    .controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(255,255,255,0.9);
      padding: 0.5rem;
      border-radius: 4px;
      font-size: 0.9rem;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
    }
    .controls label { display: block; margin-bottom: 0.5rem; }
    .controls input[type="range"] { width: 150px; }
  </style>
</head>
<body>
<div id="map"></div>
<div class="controls">
<label>表示年: <span id="threshold-label">1950</span></label>
<input type="range" id="threshold" min="1860" max="2100" value="1950">

<label>月: <span id="month-label">1</span></label>
<input type="range" id="month-va" min="1" max="12" value="1">
<label>日: <span id="day-label">1</span></label>
<input type="range" id="day-va" min="1" max="31" value="1">

<label><input type="checkbox" id="time-filter-toggle" checked>時系列有効</label>
<label><input type="checkbox" id="name-filter-toggle" checked>駅名表示</label>
<label><input type="checkbox" id="icon-filter-toggle" checked>駅表示</label>
<p><div class="eins"></div>単線（1線）</p>
<p><div class="zwei"></div>複線（2線）</p>
<p><div class="drei"></div>三線（3線）</p>
<p><div class="vier"></div>複々線（4線）</p>
<p><div class="sechs"></div>三複線（6線）</p>
<p><div class="sieben"></div>五複線（10線）</p>
<br>
<label><input type="radio" id="N05_001" name="layer" value="1">種別</label>
<div id="aaa" style="display: none;">
    <p><div class="red_line"></div>新幹線</p>
    <p><div class="black_line"></div>国鉄・JR</p>
    <p><div class="navy_line"></div>公営</p>
    <p><div class="blue_line"></div>私鉄</p>
    <p><div class="green_line"></div>第三セクター</p>
    <p><div class="purple_line"></div>簡易軌道</p>
    <p><div class="brown_line"></div>森林鉄道・林用軌道</p>
    <p><div class="gray_line"></div>専用線・側線等</p>
</div>
<label><input type="radio" id="gauge" name="layer" value="2">軌間</label>
<div id="iii" style="display: none;">
    <p><div class="red_line"></div>1435mm</p>
    <p><div class="purple_line"></div>1372mm</p>
    <p><div class="blue_line"></div>1067mm</p>
    <p><div class="green_line"></div>1050mm</p>
    <p><div class="brown_line"></div>762mm</p>
    <p><div class="pink_line"></div>モノレール</p>
    <p><div class="navy_line"></div>新交通・そのほか</p>
    <p><div class="black_line"></div>不明</p>
</div>
<label><input type="radio" id="Electrific" name="layer" value="3">電化</label>
<div id="uuu" style="display: none;">
    <p><div class="red_line"></div>AC 25,000V</p>
    <p><div class="pink_line"></div>AC 20,000V</p>
    <p><div class="navy_line"></div>DC 1,500V</p>
    <p><div class="blue_line"></div>DC 750V</p>
    <p><div class="green_line"></div>DC 600V</p>
    <p><div class="black_line"></div>非電化</p>
</div>

<!--
<iframe src="hanrei.html" width="150px" height="310px"></iframe>
-->

</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="01_Hokkaido.js"></script>

<script>
const map = L.map('map', { zoomSnap: 0.1 })
    .setView([43.0619, 141.3544], 10);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);


let sta01original, rail01original, sta_name01original;
let sta01layer, rail01layer, sta_name01layer;
const thresholdInput = document.getElementById('threshold');
const thresholdLabel = document.getElementById('threshold-label');
const monthInput = document.getElementById('month-va');
const monthLabel = document.getElementById('month-label');
const dayInput = document.getElementById('day-va');
const dayLabel = document.getElementById('day-label');
const TIMEfilterToggle = document.getElementById('time-filter-toggle');
const NAMEfilterToggle = document.getElementById('name-filter-toggle');
const ICONfilterToggle = document.getElementById('icon-filter-toggle');
const owner = document.getElementById('N05_001');
const gauge_size = document.getElementById('gauge');
const elect = document.getElementById('Electrific');



// GeoJSONを読み込んで初期化

fetch('01_Rail_hokkaido.geojson')
  .then(res => res.json())
  .then(data => {
    rail01original = data;
    updateLayer();
  })
  .catch(err => console.error('GeoJSON 読み込みエラー:', err));

    
fetch('01_Sta_hokkaido.geojson')
  .then(res => res.json())
  .then(data => {
    sta01original = data;
    updateLayer();
  })
  .catch(erro => console.error('GeoJSON 読み込みエラー:', err));

    
fetch('01_Sta_hokkaido.geojson')
  .then(res => res.json())
  .then(data => {
    sta_name01original = data;
    updateLayer();
  })
  .catch(erro => console.error('GeoJSON 読み込みエラー:', err));

// レイヤ更新関数
function updateLayer() {
  const thresh = +thresholdInput.value;
  thresholdLabel.textContent = thresh;
  const thresh_m = +monthInput.value;
  monthLabel.textContent = thresh_m;
  const thresh_d = +dayInput.value;
  dayLabel.textContent = thresh_d;
  if (rail01layer) {
    map.removeLayer(rail01layer);
  }
  if (sta01layer) {
    map.removeLayer(sta01layer);
  }
  if (sta_name01layer) {
    map.removeLayer(sta_name01layer);
  }
  rail01layer = L.geoJSON(rail01original, {
    filter: features => {
      if (!TIMEfilterToggle.checked) return true;
      year = (features.properties.start_y < thresh) && (features.properties.end_y > thresh)
      s_month = (features.properties.start_y == thresh) && (features.properties.start_m < thresh_m)
      s_day = (features.properties.start_m == thresh_m) && (features.properties.start_d <= thresh_d)
      e_month = (features.properties.end_y == thresh) && (features.properties.end_m > thresh_m)
      e_day = (features.properties.end_m == thresh_m) && (features.properties.end_d > thresh_d)
      return year || s_month || s_day || e_month || e_day;
    },
    //pointToLayer: function(features, latlng) {
    //  return L.marker(latlng, {icon: customIcon});
    //},

    style: (features) => {
      const styleOptions = {
        weight: features.properties.line * 2
      };

      if (owner.checked) {
        styleOptions.color = features.properties.N05_001 === '1' ? '#ff0000' ://赤
                             features.properties.N05_001 === '2' ? '#000000' ://黒
                             features.properties.N05_001 === '3' ? '#0000aa' ://紺
                             features.properties.N05_001 === '4' ? '#0088ff' ://緑
                             features.properties.N05_001 === '5' ? '#008800' ://青
                             features.properties.N05_001 === '6' ? '#880088' ://紫
                             features.properties.N05_001 === '7' ? '#773300' ://茶
                             '#777777';//灰
      } else if (gauge_size.checked) {
        styleOptions.color = features.properties.gauge === 1435 ? '#ff0000' ://赤
                             features.properties.gauge === 1372 ? '#880088' ://紫
                             features.properties.gauge === 1067 ? '#0088ff' ://青
                             features.properties.gauge === 1050 ? '#008800' ://緑
                             features.properties.gauge === 762 ? '#773300' ://茶
                             features.properties.gauge === 1 ? '#ff55cc' ://桃 モノレール
                             features.properties.gauge === 2 ? '#0000aa' ://紺 新交通
                             '#000000';//黒
      } else if (elect.checked) {
        styleOptions.color = features.properties.Electrific === 'AC 25000V' ? '#ff0000' ://赤
                             features.properties.Electrific === 'AC 20000V' ? '#ff55cc' ://桃
                             features.properties.Electrific === 'DC 1500V' ? '#0000aa' ://紺
                             features.properties.Electrific === 'DC 750V' ? '#0088ff' ://青
                             features.properties.Electrific === 'DC 600V' ? '#008800' ://緑
                             '#000000';//黒
      } else {
        styleOptions.color = '#000000';//黒
      }

      return styleOptions;
    },
    
    onEachFeature: (features, layer) => {
      layer.bindPopup(`会社: ${features.properties.N05_003}<br>
      路線: ${features.properties.N05_002}<br>
      軌間: ${features.properties.gauge}<br>
      電化: ${features.properties.Electrific}<br>
      開: ${features.properties.start_org}<br>
      自: ${features.properties.start}<br>
      至: ${features.properties.end}`);
    }
    
  }).addTo(map);

  sta01layer = L.geoJSON(sta01original, {
    filter: features => {
		  if (!ICONfilterToggle.checked) return false;
      if (!TIMEfilterToggle.checked) return true;
      return features.properties.start_y <= thresh && features.properties.end_y > thresh;
    },
    
    pointToLayer: function(features, latlng) {
      var staicon = features.properties.type === '信号場' ? "ss" :
                    features.properties.type === '仮信号場' ? "ss" :
                    features.properties.type === '貨物駅' ? "fs" :
                    features.properties.type === '仮貨物駅' ? "fs" :
                    features.properties.type === 'バス停' ? "bs" :
                    "st";
      
      return L.marker(latlng, {icon: staicon === "st" ? L.icon({iconUrl: 'sta.svg', iconSize: [10, 10]}) :
                                     staicon === "bs" ? L.icon({iconUrl: 'bus_sta.svg', iconSize: [11, 11]}) :
                                     staicon === "ss" ? L.icon({iconUrl: 'sig_sta.svg', iconSize: [11, 11]}) :
                                     staicon === "fs" ? L.icon({iconUrl: 'fre_sta.svg', iconSize: [12, 12]}) :
                                     L.icon({iconUrl: 'sta.svg', iconSize: [10, 10]
                              , html: features.properties.N05_011}) 
                     });
    },
    
    onEachFeature: (features, layer) => {
      layer.bindPopup(`駅名:<b> ${features.properties.N05_011}</b><br>
      会社: ${features.properties.N05_003}<br>
      路線: ${features.properties.N05_002}<br>
      開: ${features.properties.start_org}<br>
      自: ${features.properties.start}<br>
      至: ${features.properties.end}`);
    }
    
  }).addTo(map);


  sta_name01layer = L.geoJSON(sta_name01original, {
    filter: features => {
	    if (!NAMEfilterToggle.checked) return false;
      if (!TIMEfilterToggle.checked) return true;
      return station_name = features.properties.start_y <= thresh && features.properties.end_y > thresh; 
    },
    pointToLayer: function(features, latlng) {
	return L.marker(latlng, {icon: L.divIcon({html: '<div class="icontext">' + features.properties.N05_011 + '</div>', iconSize: [0, 0]}) 
                     });
    }    
  }).addTo(map);

}

function init(){
    var overlay = {
   	    "rail": rail01layer,
	    "staname": sta_name01layer,
       	"station": sta01layer,
   	}
   	L.control.layers(null, overlay).addTo(map);
}
    

  // GUIイベント
  thresholdInput.addEventListener('input', updateLayer);
  monthInput.addEventListener('input', updateLayer);
  dayInput.addEventListener('input', updateLayer);
  TIMEfilterToggle.addEventListener('change', updateLayer);
  NAMEfilterToggle.addEventListener('change', updateLayer);
  ICONfilterToggle.addEventListener('change', updateLayer);

</script>
    
</body>
</html>
